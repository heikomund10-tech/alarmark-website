<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alarmark – Mockup Startseite v2 (zur Abnahme)</title><style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(../assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(../assets/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(../assets/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
:root{--slate:#172E38;--char:#263238;--copper:#C66A45;--sage:#8A9C96;--sage7:#73857F;--ivory:#F5F2EB;--line:#DDE2DE;--act:#A94E2D;--act-h:#913F23;--act-p:#81351E;--dis:#B9CAC3;--focus:#155EEF;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;--r1:8px;--r2:16px;--sh:0 1px 2px rgba(23,46,56,.06),0 8px 24px rgba(23,46,56,.07);--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}body{margin:0;font:400 1rem/1.55 "IBM Plex Sans",system-ui,sans-serif;color:var(--slate);background:#E6E9E5}button{font:inherit;color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 var(--s5);border:0;border-radius:var(--r1);background:var(--act);color:#fff;font-weight:500;font-size:1.0625rem;text-decoration:none;cursor:pointer;transition:background-color .15s var(--e),transform .12s var(--e)}
.btn:active{background:var(--act-p);transform:scale(.98)}.btn:disabled{background:var(--dis);color:var(--slate);cursor:not-allowed;transform:none}
.lnk{display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:none;color:var(--act);font-weight:500;text-decoration:underline;text-underline-offset:.3em;cursor:pointer}.lnk:disabled{color:#5E6E69;text-decoration:none}
@media(hover:hover){.btn:hover:not(:disabled){background:var(--act-h)}.opt:hover{border-color:var(--slate)}}
.quiz{background:#fff;border-radius:var(--r2);padding:var(--s5);box-shadow:var(--sh);scroll-margin-top:var(--s5)}.qbar{height:4px;border-radius:2px;background:var(--line);margin-bottom:var(--s5);overflow:hidden}.qbar>i{display:block;height:100%;background:var(--copper)}
.qstep{display:grid;gap:var(--s3);min-height:200px;align-content:start}.qq{font-size:1.25rem;font-weight:600;line-height:1.3;margin:0 0 var(--s2)}
.opt{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:var(--s3) var(--s4);border:1.5px solid var(--sage7);border-radius:var(--r1);background:#fff;text-align:left;cursor:pointer;transition:border-color .15s var(--e),transform .12s var(--e)}.opt::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--sage7)}.opt:active{transform:scale(.99)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s5)}.small{font-size:.875rem;line-height:1.5}
.tip{background:#fff;border-radius:var(--r2);padding:var(--s5)}.tip b{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}.tip b::after{content:"";width:20px;height:4px;background:var(--copper)}
.merk{font-size:1.25rem;font-weight:600}.merk span{display:block;font-size:1rem;font-weight:500;color:var(--char)}.merk::after{content:"";display:block;width:32px;height:4px;background:var(--copper);margin-top:var(--s3)}
.paths{position:relative;display:grid;gap:var(--s4);padding-left:32px;margin:var(--s6) 0}.paths::before{content:"";position:absolute;left:7px;top:40px;bottom:40px;width:2px;background:var(--sage)}
.path{position:relative;background:var(--ivory);border-radius:var(--r2);padding:var(--s5)}.path::before{content:"";position:absolute;left:-32px;top:var(--s6);width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--slate)}
.mk{position:relative;margin:0;aspect-ratio:4/5;border-radius:var(--r2);overflow:hidden;background:#DCE2DF}.mk>img:first-child{width:100%;height:100%;object-fit:cover;object-position:50% 18%}.ai-label{position:absolute;top:var(--s3);left:var(--s3);width:32px;height:32px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.cv{display:flex;gap:48px;align-items:flex-start;padding:48px;overflow-x:auto}.cv>div>p{margin:0 0 12px;font-weight:500;font-size:.875rem}
.frame{position:relative;container-type:inline-size;box-shadow:0 2px 24px rgba(23,46,56,.12)}.m{width:390px;flex:none}.d{width:1440px;flex:none}
.fold{position:absolute;left:0;right:0;border-top:2px dashed var(--focus);z-index:2;pointer-events:none}.fold span{position:absolute;right:8px;top:4px;font-size:.75rem;background:var(--focus);color:#fff;padding:2px 8px;border-radius:4px}
.pg{--h1:2.125rem;--h2:1.625rem;--px:20px}.pg h1,.pg h2,.pg h3{font-weight:600;margin:0;text-wrap:balance}.pg h1{font-size:var(--h1);line-height:1.12;letter-spacing:-.015em;margin-bottom:var(--s5)}.pg h2{font-size:var(--h2);line-height:1.2;margin-bottom:var(--s4)}.pg h3{font-size:1.25rem;margin-bottom:var(--s2)}.pg p{margin:0 0 var(--s4);max-width:62ch}
.in{max-width:1200px;margin:0 auto;padding:0 var(--px)}.hd{background:var(--ivory)}.hd .in{display:flex;align-items:center;justify-content:space-between;min-height:64px}.hd nav{display:none}.hd nav a{color:var(--slate);text-decoration:none;font-weight:500;margin-left:32px;padding:12px 0}
.menu{min-height:44px;padding:0 var(--s4);border:1.5px solid var(--sage7);border-radius:var(--r1);background:none;font-weight:500}
.hero{background:var(--ivory)}.hero .in{display:grid;gap:var(--s5);padding-top:var(--s5);padding-bottom:var(--s7)}.hero .btn{width:100%;margin-bottom:var(--s5)}.lead{font-size:1.125rem;color:var(--char)}
.sec{padding:var(--s8) 0;background:var(--ivory)}.w{background:#fff}.dk{background:var(--slate);color:#fff}.dk p{color:#E7ECEA}.dk :focus-visible{outline-color:#fff}.two{display:grid;gap:var(--s6)}
blockquote{margin:0 0 var(--s5)}details{border-top:1px solid var(--line)}summary{display:flex;justify-content:space-between;gap:var(--s4);min-height:56px;align-items:center;padding:var(--s4) 0;font-weight:600;cursor:pointer;list-style:none}summary::after{content:"+";font-size:1.25rem}details[open] summary::after{content:"–"}
.ft{background:var(--slate);color:#E7ECEA;padding:var(--s7) 0}.ft a{color:#fff;margin-right:var(--s5)}
@container (min-width:960px){.pg{--h1:3.25rem;--h2:2rem;--px:48px}.hd nav{display:block}.menu{display:none}.hd .logo{width:160px;height:auto}
.hero .in{grid-template-columns:1fr 1fr;align-items:center;gap:var(--s8);padding-top:var(--s7);padding-bottom:var(--s8)}.hero .btn{width:auto}
.sec{padding:var(--s9) 0}.two{grid-template-columns:1fr 1fr;gap:var(--s8);align-items:start}
.paths{grid-template-columns:repeat(3,1fr);gap:var(--s5);padding:32px 0 0}.paths::before{left:16.67%;right:16.67%;top:7px;bottom:auto;width:auto;height:2px}.path::before{left:50%;top:-32px;margin-left:-8px}}
</style></head><body>
<template id="pg"><div class="pg">
<header class="hd"><div class="in"><a href="#"><img class="logo" src="../assets/logo/alarmark_logo_primaer.svg" width="128" height="20" alt="alarmark Startseite"></a><nav aria-label="Hauptmenü"><a href="#check">Check</a><a href="/kosten/">Kosten</a><a href="#">Wege</a><a href="#">Mark</a><a href="#">Fragen</a></nav><button class="menu" aria-expanded="false">Menü</button></div></header>
<main>
<section class="hero"><div class="in"><div><h1>Welche Alarmanlage passt zu deinem Zuhause?</h1><a class="btn" href="#check">Jetzt Alarm-Check starten</a><p class="lead">Ob Haus oder Wohnung, Selbstmontage oder Fachbetrieb: Finde in nur einer Minute heraus, welche Lösung für dich infrage kommt. Sechs einfache Fragen, eine erste Orientierung – kostenlos und ohne Anmeldung.</p></div>
<figure class="mk"><img src="../assets/img/mark-hero.webp" width="800" height="1000" alt="Mark im dunkelblauen Hemd im hellen Eingangsbereich" fetchpriority="high"><img class="ai-label" src="../assets/ai-label.png" width="32" height="32" alt="KI-generiert"></figure></div></section>
<section class="sec w"><div class="in two"><div><h2>Sechs Fragen. Mehr Klarheit.</h2><p>Was möchtest du absichern? Was ist dir besonders wichtig? Und wie viel möchtest du selbst übernehmen?</p><p>Unser kurzer Check hilft dir, deine Anforderungen einzuordnen und die passende Art von Alarmanlage zu finden.</p><p>Dein Ergebnis erhältst du direkt – ohne E-Mail-Adresse. Wenn du tiefer einsteigen möchtest, schicken wir dir gerne weitere Informationen.</p><a class="btn" href="#check">Meine Möglichkeiten entdecken</a></div>
<div class="quiz" id="check"><div class="qbar"><i style="width:16.7%"></i></div><div class="qstep"><p class="qq">Wohnst du zur Miete oder im Eigentum?</p><button class="opt" aria-pressed="false">Zur Miete</button><button class="opt" aria-pressed="false">Im Eigentum</button></div><div class="qnav"><button class="lnk" disabled>Zurück</button><span class="small">1 von 6</span></div></div></div></section>
<section class="sec"><div class="in two"><div><h2>Was kostet eine gute Alarmanlage?</h2><p>Die Anschaffung ist nur ein Teil der Rechnung. Je nach Lösung kommen Installation, laufende Gebühren oder Wartung hinzu.</p><p>Entscheidend ist deshalb nicht allein der Kaufpreis, sondern was dich die Anlage über mehrere Jahre insgesamt kostet.</p><p>Wir zeigen dir, wie du Angebote fair vergleichst und worauf du achten solltest.</p><a class="lnk" href="/kosten/">Kosten richtig vergleichen</a></div>
<div class="tip"><b>Marks Tipp</b>„Kläre zuerst, was deine Alarmanlage leisten soll. Dann lassen sich auch die Preise besser vergleichen.“</div></div></section>
<section class="sec w"><div class="in"><h2>Drei Möglichkeiten. Was passt zu dir?</h2><p>Es gibt unterschiedliche Wege zur passenden Alarmanlage. Entscheidend ist, wie viel du selbst übernehmen möchtest und welche Betreuung du brauchst.</p>
<div class="paths"><div class="path"><h3>Selbst installieren</h3><p>Du möchtest deine Alarmanlage selbst auswählen und einbauen? Wir zeigen dir, welche Voraussetzungen wichtig sind und worauf du achten solltest.</p><a class="lnk" href="#">Selbstmontage entdecken</a></div>
<div class="path"><h3>Vom Fachbetrieb installieren lassen</h3><p>Du möchtest Planung und Einbau lieber Profis überlassen? Erfahre, welche Leistungen ein Fachbetrieb übernehmen kann und welche Fragen du stellen solltest.</p><a class="lnk" href="#">Fachbetrieb kennenlernen</a></div>
<div class="path"><h3>Mit professioneller Leitstelle</h3><p>Du möchtest, dass sich im Alarmfall nicht alles um deine eigene Erreichbarkeit dreht? Erfahre, wie eine Leitstelle funktioniert und welche Leistungen dazugehören können.</p><a class="lnk" href="#">Leitstellenlösungen verstehen</a></div></div>
<p>Du wohnst zur Miete? Auch für Wohnungen gibt es verschiedene Möglichkeiten.</p></div></section>
<section class="sec dk"><div class="in"><h2>Nach einer Minute bist du einen Schritt weiter.</h2><p>Du erhältst eine erste Einschätzung, welche Alarmanlagenlösung zu deinen Anforderungen passen könnte – mit verständlichen Informationen zu den nächsten Schritten.</p><p>Möchtest du mehr erfahren, kannst du dir zusätzliche Tipps per E-Mail schicken lassen oder freiwillig eine Anfrage an einen Fachbetrieb stellen.</p><p><strong>Du entscheidest, wie es weitergeht.</strong></p><p class="small">Der Check ist kostenlos. Eine Weitergabe deiner Anfrage erfolgt nur mit deiner gesonderten Einwilligung. Alarmark kann dafür eine Vergütung vom Fachbetrieb erhalten.</p></div></section>
<section class="sec"><div class="in two"><figure class="mk"><img src="../assets/img/mark-portrait.webp" width="800" height="1000" loading="lazy" alt="Mark zeigt auf eine Haustür" style="object-position:45% 20%"><img class="ai-label" src="../assets/ai-label.png" width="32" height="32" alt="KI-generiert"></figure>
<div><h2>Frag Mark. Er erklärt’s dir.</h2><blockquote><p>„Ich bin Mark, die KI-Figur von Alarmark. Ich erkläre dir, wie Alarmanlagen funktionieren, worauf es bei der Auswahl ankommt und welche Unterschiede wirklich wichtig sind.</p><p>Ohne Fachchinesisch, ohne Angstmache. Dafür mit praktischen Tipps, die dir bei deiner Entscheidung helfen.“</p></blockquote><p class="merk"><span>Marks Merksatz:</span>Erst verstehen, dann entscheiden.</p><p class="small">Mark vermittelt allgemeines Wissen über Alarmanlagen und Einbruchschutz. Seine Inhalte ersetzen keine individuelle Sicherheitsberatung.</p></div></div></section>
<section class="sec w"><div class="in"><h2>Häufige Fragen</h2>
<details><summary>Welche Alarmanlage passt zu mir?</summary><p>Das hängt von deiner Wohnsituation und deinen Wünschen ab. Möchtest du selbst installieren oder lieber einen Fachbetrieb beauftragen? Reicht dir eine Benachrichtigung oder möchtest du eine Leitstellenanbindung? Unser 1-Minuten-Check hilft dir bei der ersten Orientierung.</p></details>
<details><summary>Mit welchen Kosten muss ich rechnen?</summary><p>Neben der Alarmanlage selbst können Kosten für Installation, Wartung und laufende Leistungen entstehen. Wir zeigen dir, wie du diese Kosten über fünf Jahre vergleichen kannst, damit du Angebote besser einschätzen kannst.</p></details>
<details><summary>Muss ich meine E-Mail-Adresse angeben?</summary><p>Nein. Dein Check-Ergebnis erhältst du ohne Anmeldung. Nur wenn du weitere Informationen per E-Mail möchtest, benötigen wir deine Adresse. Ob deine Anfrage an einen Fachbetrieb weitergegeben werden darf, entscheidest du separat.</p></details>
<details><summary>Ist der Alarm-Check wirklich kostenlos?</summary><p>Ja. Der Check und die optionalen Informationen per E-Mail sind kostenlos. Wenn du möchtest, kannst du zusätzlich Kontakt zu einem Fachbetrieb anfragen. Alarmark kann für die Vermittlung eine Vergütung erhalten. Für dich entsteht dadurch keine Verpflichtung zum Kauf.</p></details></div></section></main>
<footer class="ft"><div class="in"><img src="../assets/logo/alarmark_logo_invers.svg" width="128" height="20" alt="alarmark" loading="lazy"><p style="margin:24px 0">Mark ist eine KI-Figur von Alarmark.</p><a href="#">Impressum</a><a href="#">Datenschutz</a></div></footer></div></template>

<div><p>Desktop 1440 px</p><div class="frame d"><div class="fold" style="top:900px"><span>Sichtbereich 1440 × 900</span></div></div></div></div>
